[workspace]
resolver = "2"
members = [
    "components/alert",
    "components/avatar",
    "components/badge",
    "components/breadcrumb",
    "components/button",
    "components/card",
    "components/checkbox",
    "components/input",
    "components/label",
    "components/progress",
    "components/separator",
    "components/skeleton",
    "components/switch",
    "components/textarea",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["shadcn/ui contributors"]
license = "MIT"
repository = "https://github.com/shadcn-ui/ui"

[workspace.dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
tailwind_fuse = "0.3"
leptos-node-ref = "0.1"
leptos-struct-component = "0.1"
leptos-style = "0.1"
