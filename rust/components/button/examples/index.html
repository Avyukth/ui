<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Component Examples</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config for shadcn/ui colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3 31.8% 91.4%)",
                        input: "hsl(214.3 31.8% 91.4%)",
                        ring: "hsl(221.2 83.2% 53.3%)",
                        background: "hsl(0 0% 100%)",
                        foreground: "hsl(222.2 84% 4.9%)",
                        primary: {
                            DEFAULT: "hsl(221.2 83.2% 53.3%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        destructive: {
                            DEFAULT: "hsl(0 84.2% 60.2%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        muted: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                        accent: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                    },
                }
            }
        }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        // Check which example to load from URL param
        const urlParams = new URLSearchParams(window.location.search);
        const example = urlParams.get('example') || 'comprehensive';

        const wasmAvailable = await fetch(`../pkg/${example}.js`)
            .then(res => res.ok)
            .catch(() => false);

        if (!wasmAvailable) {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-background p-8 flex items-center justify-center">
                    <div class="max-w-2xl text-center space-y-4">
                        <h1 class="text-3xl font-bold">Build Required</h1>
                        <p class="text-muted-foreground">
                            Build the WASM example first:
                        </p>
                        <pre class="bg-muted p-4 rounded text-sm text-left overflow-x-auto">
cd rust/components/button
wasm-pack build --target web --out-dir pkg --example ${example}</pre>
                        <div class="flex gap-2 justify-center mt-4">
                            <a href="?example=basic" class="text-primary hover:underline">Basic Example</a>
                            <span class="text-muted-foreground">|</span>
                            <a href="?example=comprehensive" class="text-primary hover:underline">Comprehensive Example</a>
                        </div>
                    </div>
                </div>
            `;
        } else {
            try {
                const module = await import(`../pkg/${example}.js`);
                await module.default();
                console.log(`✅ ${example} example loaded successfully!`);
            } catch (err) {
                console.error('Failed to load example:', err);
                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen bg-background p-8 flex items-center justify-center">
                        <div class="max-w-2xl text-center space-y-4">
                            <h1 class="text-3xl font-bold text-destructive">Error Loading Example</h1>
                            <p class="text-muted-foreground">${err.message}</p>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
